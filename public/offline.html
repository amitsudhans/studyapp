<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Offline | Study App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Instrument Sans', system-ui, sans-serif; }
        body { background-color: #030712; color: #f8fafc; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1.5rem; text-align: center; }
        .card { background-color: #0f172a; border: 1px solid #1e293b; border-radius: 1.25rem; padding: 2.5rem 2rem; max-width: 420px; width: 100%; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); }
        .icon-wrapper { width: 4rem; height: 4rem; margin: 0 auto 1.25rem; background: linear-gradient(135deg, rgba(79,70,229,0.2), rgba(124,58,237,0.2)); border: 1px solid rgba(99,102,241,0.4); border-radius: 1rem; display: flex; align-items: center; justify-content: center; }
        .icon { width: 2rem; height: 2rem; color: #818cf8; }
        h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; color: #ffffff; }
        p { font-size: 0.925rem; color: #94a3b8; line-height: 1.5; margin-bottom: 1.75rem; }
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; background-color: #4f46e5; color: #ffffff; text-decoration: none; padding: 0.75rem 1.5rem; border-radius: 0.75rem; font-weight: 600; font-size: 0.9rem; border: none; cursor: pointer; transition: all 0.2s ease; width: 100%; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3); }
        .btn:hover { background-color: #4338ca; transform: translateY(-1px); }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon-wrapper">
            <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 2.829a9 9 0 010-12.728m0 0l2.829 2.829M8.464 15.536a5 5 0 010-7.072m0 0l2.829 2.829M1 1l22 22"></path>
            </svg>
        </div>
        <h1>You're Offline</h1>
        <p>It seems you've lost your internet connection. Please check your network connection and try again.</p>
        <button class="btn" onclick="window.location.reload()">
            <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
            </svg>
            <span>Retry Connection</span>
        </button>
    </div>
</body>
</html>
